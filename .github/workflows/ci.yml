name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up opam env
        run: |
          eval $(opam env --switch=forge --set-switch)
          echo "PATH=$PATH" >> $GITHUB_ENV
          echo "OPAM_SWITCH_PREFIX=$OPAM_SWITCH_PREFIX" >> $GITHUB_ENV
          echo "CAML_LD_LIBRARY_PATH=$CAML_LD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "OCAML_TOPLEVEL_PATH=$OCAML_TOPLEVEL_PATH" >> $GITHUB_ENV

      - name: Show environment
        run: |
          uname -srm
          ocaml -version
          dune --version
          z3 --version | head -1
          nvidia-smi --query-gpu=name,driver_version --format=csv,noheader 2>/dev/null || echo "(no GPU detected)"

      - name: Build
        run: dune build

      - name: Run test suite
        run: bash test/run_all.sh